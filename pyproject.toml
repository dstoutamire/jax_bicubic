[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-bicubic"
version = "0.1.0"
description = "C2-continuous bicubic interpolation with B-spline prefiltering for JAX"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "David Stoutamire"}
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Image Processing",
]
keywords = ["jax", "interpolation", "bicubic", "b-spline", "image-processing"]

dependencies = [
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "matplotlib>=3.5",
    "numpy>=1.20",
]
test = [
    "pytest>=7.0",
    "matplotlib>=3.5",
    "numpy>=1.20",
]

[project.urls]
Homepage = "https://github.com/dstoutamire/jax_bicubic"
Repository = "https://github.com/dstoutamire/jax_bicubic"

[tool.setuptools.packages.find]
where = ["."]
include = ["jax_bicubic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
